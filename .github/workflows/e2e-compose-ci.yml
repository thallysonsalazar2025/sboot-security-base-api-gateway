name: E2E Compose CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'docker-compose.e2e.yml'
      - 'docker-compose.secullum-stub.yml'
      - 'e2e/secullum-stub/**'
      - '.env.example'
      - '.gitignore'
      - 'src/main/resources/application.yml'
      - 'scripts/e2e-up.sh'
      - 'scripts/e2e-smoke.sh'
      - 'README.md'
      - '.github/workflows/e2e-compose-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-compose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JWT_HS512_SECRET: ci-only-hs512-secret-ci-only-hs512-secret-ci-only-hs512-secret-1234567890
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose model
        run: docker compose -f docker-compose.e2e.yml -f docker-compose.secullum-stub.yml config --quiet

      - name: Verify RabbitMQ health gate
        run: |
          grep -q 'rabbitmq-diagnostics' docker-compose.e2e.yml
          grep -q 'condition: service_healthy' docker-compose.e2e.yml

      - name: Verify deterministic point provider stub
        run: |
          python -m py_compile e2e/secullum-stub/server.py
          grep -Fq 'SECULLUM_BASE_URL: http://secullum-stub:8080' docker-compose.secullum-stub.yml
          grep -Fq 'secullum-stub:' docker-compose.secullum-stub.yml
          grep -Fq 'condition: service_healthy' docker-compose.secullum-stub.yml

      - name: Exercise Secullum stub scenarios
        run: |
          python e2e/secullum-stub/server.py > /tmp/secullum-stub.log 2>&1 &
          STUB_PID=$!
          trap 'kill "$STUB_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = 'http://127.0.0.1:8080'
          assert json.load(urllib.request.urlopen(base + '/health'))['status'] == 'UP'

          req = urllib.request.Request(
              base + '/secullum/events?companyId=11111111-1111-1111-1111-111111111111&period=2026-08',
              headers={'X-Correlation-Id': 'ci-correlation-id'},
          )
          response = urllib.request.urlopen(req)
          events = json.load(response)
          assert response.headers['X-Correlation-Id'] == 'ci-correlation-id'
          assert len(events) == 2

          unavailable = base + '/secullum/events?companyId=00000000-0000-0000-0000-000000000503&period=2026-08'
          try:
              urllib.request.urlopen(unavailable)
              raise AssertionError('expected 503 for unavailable company')
          except urllib.error.HTTPError as exc:
              assert exc.code == 503

          recovery = base + '/secullum/events?companyId=00000000-0000-0000-0000-000000000504&period=2026-08'
          try:
              urllib.request.urlopen(recovery)
              raise AssertionError('expected first recovery request to fail')
          except urllib.error.HTTPError as exc:
              assert exc.code == 503
          assert urllib.request.urlopen(recovery).status == 200
          PY

      - name: Verify secure defaults
        run: |
          grep -Fq 'JWT_HS512_SECRET: ${JWT_HS512_SECRET:?JWT_HS512_SECRET is required}' docker-compose.e2e.yml
          grep -Fq 'LOG_ELASTICSEARCH_ENABLED: ${LOG_ELASTICSEARCH_ENABLED:-false}' docker-compose.e2e.yml
          grep -Fq 'enabled: ${LOG_ELASTICSEARCH_ENABLED:false}' src/main/resources/application.yml
          grep -Fq '${JWT_HS512_SECRET}' src/main/resources/application.yml
          ! grep -Eq 'JWT_HS512_SECRET:[^}]' src/main/resources/application.yml

      - name: Verify local secret hygiene
        run: |
          test -f .env.example
          grep -Eq '^JWT_HS512_SECRET=$' .env.example
          grep -Eq '^LOG_ELASTICSEARCH_ENABLED=false$' .env.example
          grep -Eq '^\.env$' .gitignore
          grep -Eq '^\.env\.\*$' .gitignore
          ! git ls-files --error-unmatch .env >/dev/null 2>&1

      - name: Validate E2E launchers
        run: |
          sh -n scripts/e2e-up.sh
          sh -n scripts/e2e-smoke.sh
          grep -Fq 'docker compose' scripts/e2e-up.sh
          grep -Fq 'docker-compose.secullum-stub.yml' scripts/e2e-up.sh
          grep -Fq -- '--wait' scripts/e2e-up.sh
          grep -Fq 'TENANT_A_TOKEN' scripts/e2e-smoke.sh
          grep -Fq 'TENANT_B_TOKEN' scripts/e2e-smoke.sh
          grep -Fq 'X-Correlation-Id' scripts/e2e-smoke.sh
          grep -Fq 'response_correlation_id' scripts/e2e-smoke.sh
          grep -Fq 'correlation id was not preserved' scripts/e2e-smoke.sh
          grep -Fq 'assert_invalid_token_rejected' scripts/e2e-smoke.sh
          grep -Fq 'invalid.jwt.token' scripts/e2e-smoke.sh
