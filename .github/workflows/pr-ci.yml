name: Pull Request CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_HS512_SECRET: ci-only-hs512-secret-ci-only-hs512-secret-ci-only-hs512-secret-1234567890
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        id: verify
        shell: bash
        run: |
          set +e
          if [ -x ./mvnw ]; then
            ./mvnw -B verify 2>&1 | tee verify.log
          else
            mvn -B verify 2>&1 | tee verify.log
          fi
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-maven-verify-log
          path: verify.log
          if-no-files-found: error
          retention-days: 3

      - name: Enforce verify result
        if: steps.verify.outputs.status != '0'
        run: exit 1
